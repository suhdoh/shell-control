name: Windows checks
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    runs-on: windows-latest
    strategy:
      matrix:
        shell: [powershell, pwsh]
    steps:
      - uses: actions/checkout@v4
      - name: Test PowerShell compatibility
        shell: ${{ matrix.shell }}
        run: ./tests/Test-Project.ps1
